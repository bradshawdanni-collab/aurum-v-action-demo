schema_version: "1.0"
repository: "bradshawdanni-collab/aurum-v-action-demo"
repository_role: "external-action-consumer-proof"

authoritative_for:
  - "external installation proof for the published AURUM-V GitHub Action"
  - "consumer-side demonstration workflows"
  - "tamper-detection demonstration evidence generated by this repository"

not_authoritative_for:
  - "public GitHub Action distribution"
  - "admissibility-state definitions"
  - "kernel invariants"
  - "state-transition contracts"
  - "execution authority"
  - "application or product authority"
  - "reviewer interface authority"
  - "domain evidence truth"
  - "independent certification"

canonical_upstream:
  repository: "bradshawdanni-collab/aurum-v-action"
  version: "v1.0.0"
  commit: "UNRESOLVED"
  exact_commit_required: true
  pin_status: "UNRESOLVED_FAIL_CLOSED"

consumer_boundary:
  may_demonstrate_installation: true
  may_demonstrate_verified_and_tampered_cases: true
  may_redefine_action_semantics: false
  may_redefine_kernel_semantics: false
  may_claim_distribution_authority: false

required_reviews:
  - "Action implementation reviewer"
  - "constitutional owner when authority-boundary claims are affected"

status: "pending-exact-upstream-commit"
